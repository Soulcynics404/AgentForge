<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0" stop-color="#0B0F1E"/>
      <stop offset="1" stop-color="#131A33"/>
    </linearGradient>
    <linearGradient id="accent" x1="120" y1="120" x2="400" y2="400">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="steel" x1="140" y1="300" x2="380" y2="420">
      <stop offset="0" stop-color="#E2E8F0"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <radialGradient id="spark" cx="256" cy="180" r="60">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- spark glow behind anvil -->
  <circle cx="256" cy="185" r="70" fill="url(#spark)" opacity="0.9"/>

  <!-- swarm nodes above the anvil -->
  <g stroke="url(#accent)" stroke-width="7" opacity="0.95">
    <line x1="256" y1="118" x2="196" y2="168"/>
    <line x1="256" y1="118" x2="316" y2="168"/>
    <line x1="196" y1="168" x2="316" y2="168"/>
  </g>
  <circle cx="256" cy="112" r="15" fill="#818CF8"/>
  <circle cx="192" cy="172" r="12" fill="#A78BFA"/>
  <circle cx="320" cy="172" r="12" fill="#A78BFA"/>

  <!-- hammer head striking -->
  <rect x="330" y="196" width="74" height="46" rx="10" fill="url(#accent)" transform="rotate(24 367 219)"/>
  <rect x="352" y="228" width="14" height="64" rx="7" fill="#C4B5FD" transform="rotate(24 359 260)"/>

  <!-- anvil body -->
  <g fill="url(#steel)">
    <path d="M136 300 h240 c0 26 -22 44 -52 48 h-58 l10 40 h34 a12 12 0 0 1 12 12 v14 H190 v-14 a12 12 0 0 1 12 -12 h34 l10 -40 h-58 c-30 -4 -52 -22 -52 -48 Z"/>
  </g>
  <!-- hot spot on anvil face -->
  <ellipse cx="238" cy="300" rx="58" ry="9" fill="#F59E0B" opacity="0.85"/>

  <!-- base line -->
  <rect x="176" y="430" width="160" height="14" rx="7" fill="#475569"/>
</svg>
